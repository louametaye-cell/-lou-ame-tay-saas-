# ==============================================================================
# CONFIGURATION NGINX PRODUCTION ROBUSTE (LOU AME TAY ? - 1000 RESTAURANTS)
# Rate Limiting 50 req/s par IP & Gestion Propre Erreur HTTP 429
# ==============================================================================

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance TCP & Buffers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # RATE LIMITING : Limite à 50 requêtes/seconde par IP
    limit_req_zone $binary_remote_addr zone=resto_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    limit_req_status 429;

    # Upstream Node.js / Next.js Cluster
    upstream nextjs_upstream {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name louametay.sn *.louametay.sn;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name louametay.sn *.louametay.sn;

        # SSL Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/louametay.sn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/louametay.sn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Page d'erreur personnalisée 429 (Trop de requêtes)
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error":"Trop de requêtes simultanées détectées. Veuillez patienter 2 secondes avant de rafraîchir.","code":"RATE_LIMIT_EXCEEDED","status":429}';
        }

        # Cache statique
        location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2)$ {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 30d;
            expires 30d;
            access_log off;
        }

        # Next.js Static Chunks
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 365d;
            expires 365d;
            access_log off;
        }

        # Proxy avec Rate Limiting à 50 req/s
        location / {
            limit_req zone=resto_limit burst=20 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
